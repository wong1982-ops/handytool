    ProjectSubscriptionObject:
      type: object
      required:
        - subscriptionUuid
        - status
      properties:
        subscriptionUuid:
          type: string
          format: uuid
          description: The UUID of the subscription associated with the project
          example: "d41ae335-7f54-4fdd-b6aa-29b433d21505"
        status:
          type: string
          enum:
            - active
            - expired
            - scheduled
          description: |
            The status of the subscription relative to the effective date:
            - active: The effective date falls within the subscription's dateFrom and dateTo
            - expired: The effective date is after the subscription's dateTo
            - scheduled: The effective date is before the subscription's dateFrom
          example: "active"