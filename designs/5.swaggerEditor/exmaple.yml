openapi: '3.0.2'
info:
  title: Entitlement Service API
  version: 1.0.0
servers:
  - url: https://entitlement-service.test.datarock.com.au
    description: API for entitlement service in test env
  - url: https://entitlement-service.demo.datarock.com.au
    description: API for entitlement service in demo env
  - url: https://entitlement-service.prod.datarock.com.au
    description: API for entitlement service in prod env

paths:
  /project/{projectUuid}/entitlements:
    get:
      tags:
        - Entitlements
      summary: Get a list of entitlements for a project
      parameters:
        - $ref: '#/components/parameters/projectUuid'
        - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntitlementObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  v2/project/{projectUuid}/subscriptions:
    get:
      tags:
        - Subscriptions
      summary: Get all subscriptions for a project
      description: |
        Returns all subscriptions associated with a project, along with their status based on the effective date.
        Each subscription's status is determined by comparing the effective date with the subscription's date range:
        - active: effective date is within the subscription period (dateFrom <= effectiveDate <= dateTo)
        - expired: effective date is after the subscription period (effectiveDate > dateTo)
        - scheduled: effective date is before the subscription period (effectiveDate < dateFrom)
      parameters:
        - $ref: '#/components/parameters/projectUuid'
        - $ref: '#/components/parameters/authorizationHeader'
        - in: query
          name: effectiveDate
          description: The date to evaluate subscription status against. Defaults to today's date if not provided.
          schema:
            type: string
            format: date
          required: false
          example: "2024-12-12"
      responses:
        '200':
          description: Subscriptions found (empty array if no subscriptions exist)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSubscriptionObject'
              examples:
                single_active:
                  summary: Single active subscription
                  value:
                    - subscriptionUuid: "d41ae335-7f54-4fdd-b6aa-29b433d21505"
                      status: "active"
                multiple_mixed:
                  summary: Multiple subscriptions with different statuses
                  value:
                    - subscriptionUuid: "d41ae335-7f54-4fdd-b6aa-29b433d21505"
                      status: "active"
                    - subscriptionUuid: "a1b2c3d4-5678-9012-3456-789012345678"
                      status: "expired"
                    - subscriptionUuid: "f9e8d7c6-5432-1098-7654-321098765432"
                      status: "scheduled"
                empty:
                  summary: No subscriptions found
                  value: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/entitlements:
    get:
      tags:
        - Entitlements
      summary: List all entitlements
      parameters:
        - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2EntitlementsExportObject'
              example:
                entitlements:
                  - id: 36
                    projectId: 9c19f759-bf67-4a13-a6fd-68bd69eaa413
                    productId: 5aec28e7-ae38-4f67-b3ce-4640e407031b
                    dateFrom: 2024-01-01T00:00:00.000Z
                    dateTo: 2024-12-31T23:59:59.999Z
                    subscriptionId: 123e4567-e89b-12d3-a456-426614174000
                    isUnlimited: false
                  - id: 37
                    projectId: 83adc40e-152a-4566-82b3-295b586123a9
                    productId: 6b771755-885a-44fe-91ff-a4b3938a787b
                    dateFrom: 2025-01-01T00:00:00.000Z
                    dateTo: 2025-12-31T23:59:59.999Z
                    subscriptionId: 123e4567-e89b-12d3-a456-426614174000
                    isUnlimited: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/project/{projectUuid}/entitlements:
    get:
      tags:
        - Entitlements
      summary: Get a list of summarised entitlements for a project
      parameters:
        - $ref: '#/components/parameters/projectUuid'
        - $ref: '#/components/parameters/authorizationHeader'
        - in: query
          name: effectiveDate
          description: The date from which the entitlements are valid. Defaults to today's date.
          schema:
            $ref: '#/components/parameters/effectiveDate'
          required: false
        - in: query
          name: contractualAmountsOnly
          description: Whether to only return the contractual amount of the entitlement. Defaults to false.
          schema:
            $ref: '#/components/parameters/contractualAmountsOnly'
          required: false
        - in: query
          name: includeAmountInMetres
          description: Whether to include the sum of ledger entries in amountInMetres. When true, calculates amounts and filters out unlimited entitlements. When false, includes all entitlements with amountInMetres as undefined. Defaults to true.
          schema:
            $ref: '#/components/parameters/includeAmountInMetres'
          required: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2EntitlementsObject'
              example:
                products:
                  - id: 9c19f759-bf67-4a13-a6fd-68bd69eaa413
                    name: Pre-processing
                    amountUsedInMetres: 25000
                    isUnlimited: true
                    subscriptionId: 123e4567-e89b-12d3-a456-426614174000
                    dateFrom: 2024-01-01T00:00:00.000Z
                    dateTo: 2024-12-31T23:59:59.999Z
                    usageAvailable: true
                  - id: 5aec28e7-ae38-4f67-b3ce-4640e407031b
                    name: RQD
                    amountInMetres: 30000
                    amountUsedInMetres: 10000
                    isUnlimited: false
                    subscriptionId: 123e4567-e89b-12d3-a456-426614174000
                    dateFrom: 2024-01-01T00:00:00.000Z
                    dateTo: 2024-12-31T23:59:59.999Z
                    usageAvailable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Entitlements
      summary: Indicate that a project is entitled to use a product
      parameters:
        - $ref: '#/components/parameters/authorizationHeader'
        - $ref: '#/components/parameters/projectUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V2EntitlementDateRangeObject'
      responses:
        '201':
          description: Entitlement created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: An entitlement for this product already exists for this project within the specified date range
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/subscription/{subscriptionUuid}/entitlements:
    get:
      tags:
        - Entitlement Management
      summary: Retrieve all entitlements for a subscription
      parameters:
        - $ref: '#/components/parameters/authorizationHeader'
        - $ref: '#/components/parameters/subscriptionUuid'
        - in: query
          name: contractualAmountsOnly
          description: Whether to only return the contractual amount of the entitlement. Defaults to false.
          schema:
            $ref: '#/components/parameters/contractualAmountsOnly'
          required: false
        - in: query
          name: includeAmountInMetres
          description: Whether to include the sum of ledger entries in amountInMetres. When true, calculates amounts and filters out unlimited entitlements. When false, includes all entitlements with amountInMetres as undefined. Defaults to true.
          schema:
            $ref: '#/components/parameters/includeAmountInMetres'
          required: false
      responses:
        '200':
          description: Subscription product entitlements retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionProductEntitlementsResponse'
              example:
                entitlements:
                  - subscriptionId: d41ae335-7f54-4fdd-b6aa-29b433d21505
                    productId: 5aec28e7-ae38-4f67-b3ce-4640e407031b
                    isUnlimited: false
                    productSlug: rqd
                    amountInMetres: 4000
                  - subscriptionId: d41ae335-7f54-4fdd-b6aa-29b433d21505
                    productId: 6b771755-885a-44fe-91ff-a4b3938a787b
                    isUnlimited: true
                    productSlug: fracture
        '400':
          description: Your request was invalid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Entitlement Management
      summary: Create SubscriptionEntitlements for given subscription
      parameters:
        - $ref: '#/components/parameters/authorizationHeader'
        - $ref: '#/components/parameters/subscriptionUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionProductEntitlementsCreationInput'
            example:
              products:
                - productId: '5aec28e7-ae38-4f67-b3ce-4640e407031b'
                  isUnlimited: false
                - productId: '6b771755-885a-44fe-91ff-a4b3938a787b'
                  isUnlimited: true
      responses:
        '200':
          description: Subscription product entitlements created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionProductEntitlementsCreationOutput'
              example:
                - id: 19229f3b-4c1e-4d2a-8b5c-9f0e1a2b3c4d
                  subscriptionId: d41ae335-7f54-4fdd-b6aa-29b433d21505
                  productId: 5aec28e7-ae38-4f67-b3ce-4640e407031b
                  isUnlimited: false
                - id: 374f0d8a-3926-4a30-a89f-05f0dab76794
                  subscriptionId: d41ae335-7f54-4fdd-b6aa-29b433d21505
                  productId: 6b771755-885a-44fe-91ff-a4b3938a787b
                  isUnlimited: true
        '400':
          description: Your request was invalid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/subscription/{subscriptionUuid}/entitlements/remaining:
    get:
      tags:
        - Entitlement Management
      summary: Retrieve remaining entitlements for a subscription
      parameters:
        - $ref: '#/components/parameters/authorizationHeader'
        - $ref: '#/components/parameters/subscriptionUuid'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemainingEntitlement'
              example:
                products:
                  rqd: 6000
                  fractures: 6000
                  jsa: 6000
                projects:
                  '9c19f759-bf67-4a13-a6fd-68bd69eaa413':
                    rqd: 1000
                    fractures: 1000
                    jsa: 2000
                  '9c19f759-bf67-4a13-a6fd-68bd69eaa414':
                    rqd: 1000
                    fractures: 1000
                    jsa: 500
        '400':
          description: Your request was invalid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/subscription/{subscriptionUuid}/allocations:
    get:
      tags:
        - Entitlement Management
      summary: Retrieve allocation summary for a subscription
      parameters:
        - $ref: '#/components/parameters/authorizationHeader'
        - $ref: '#/components/parameters/subscriptionUuid'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  productsAllocated:
                    type: number
                    description: Sum of product entitlements at the subscription product level (not usage or allocation to projects), in metres
                  projectsAllocated:
                    type: number
                    description: Sum of project entitlements at the subscription project level (not usage or allocation to products), in metres
                required:
                  - productsAllocated
                  - projectsAllocated
              example:
                productsAllocated: 50000
                projectsAllocated: 25000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/subscription/{subscriptionUuid}/entitlements/product/{productUuid}:
    post:
      tags:
        - Entitlement Management
      summary: Create an immutable ledger entry for a subscription and product
      parameters:
        - $ref: '#/components/parameters/authorizationHeader'
        - $ref: '#/components/parameters/subscriptionUuid'
        - $ref: '#/components/parameters/productUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionLedgerEntryCreationInput'
            example:
              type: SUB_SETUP
              amountInMetres: 30000
              notes: Subscription setup entitlement for Essentials plan
              referenceId: PLT-3293
              referenceSystem: JIRA
      responses:
        '200':
          description: Ledger entry created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionLedgerEntryCreationOutput'
              example:
                id: '19229f3b-4c1e-4d2a-8b5c-9f0e1a2b3c4d'
                subscriptionId: 'd41ae335-7f54-4fdd-b6aa-29b433d21505'
                productId: '5aec28e7-ae38-4f67-b3ce-4640e407031b'
                type: SUB_SETUP
                amountInMetres: 30000
                notes: Subscription setup entitlement for Essentials plan
                referenceId: PLT-3293
                referenceSystem: JIRA
        '400':
          description: Your request was invalid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/subscription/{subscriptionUuid}/entitlements/product/{productUuid}/ledger-entries:
    get:
      tags:
        - Entitlement Management
      summary: Get all ledger entries for a subscription and product
      parameters:
        - $ref: '#/components/parameters/authorizationHeader'
        - $ref: '#/components/parameters/subscriptionUuid'
        - $ref: '#/components/parameters/productUuid'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionLedgerEntryCreationOutput'
              example:
                - id: '19229f3b-4c1e-4d2a-8b5c-9f0e1a2b3c4d'
                  subscriptionProductEntitlementId: 'd41ae335-7f54-4fdd-b6aa-29b433d21505'
                  type: SUB_SETUP
                  amountInMetres: 30000
                  notes: Subscription setup entitlement for Essentials plan
                  referenceId: PLT-3293
                  referenceSystem: JIRA
                  createdBy: test@datarock.com.au
                - id: '29339f4c-5d2f-5e3b-9c6d-0f1e2a3b4c5e'
                  subscriptionProductEntitlementId: 'd41ae335-7f54-4fdd-b6aa-29b433d21505'
                  type: TOP_UP
                  amountInMetres: 15000
                  notes: Additional entitlement top-up
                  referenceId: PLT-3294
                  referenceSystem: JIRA
                  createdBy: admin@datarock.com.au
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/project/{projectUuid}/entitlements/product/{productUuid}:
    get:
      tags:
        - Entitlement Management
      summary: Retrieve all ledger entries for a project, product and date
      parameters:
        - $ref: '#/components/parameters/authorizationHeader'
        - $ref: '#/components/parameters/projectUuid'
        - $ref: '#/components/parameters/productUuid'
        - $ref: '#/components/parameters/effectiveDate'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  dateFrom:
                    type: string
                    format: ISO 8601 timestamp
                    description: >
                      The date & time from which the entitlement becomes valid
                  dateTo:
                    type: string
                    format: ISO 8601 timestamp
                    description: >
                      The date & time after which the entitlement is no longer valid
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectProductEntitlementLedgerEntry'
                example:
                  dateFrom: 2024-01-01T00:00:00.000Z
                  dateTo: 2024-12-31T23:59:59.999Z
                  entries:
                    - type: SUB_SETUP
                      amountInMetres: 30000
                      notes: Subscription setup entitlement for Essentials plan
                      createdBy: user@email.com
                      createdAt: 2024-11-22T00:00:00Z
                    - type: TOP_UP
                      amountInMetres: 10001
                      createdBy: user@email.com
                      createdAt: 2024-12-25T00:00:00Z
                    - type: ADJUSTMENT
                      notes: Corrected typo in top-up amount
                      amountInMetres: -1
                      createdBy: user@email.com
                      createdAt: 2024-12-26T00:00:00Z
                    - type: ADD_PRODUCT
                      notes: Added new product
                      amountInMetres: 10000
                      createdBy: user@email.com
                      createdAt: 2024-12-27T00:00:00Z
                    - type: UPGRADE
                      notes: Upgraded to premium plan
                      amountInMetres: 20000
                      createdBy: user@email.com
                      createdAt: 2024-12-28T00:00:00Z
                    - type: RENEWAL
                      notes: Renewed subscription
                      amountInMetres: 30000
                      createdBy: user@email.com
                      createdAt: 2024-12-29T00:00:00Z

        '400':
          description: Your request was invalid, eg. you requested ledger entries on an unlimited entitlement, the requested product or project UUIDs are not well formed, etc
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Entitlement Management
      summary: Create an immutable ledger entry for a project, product & date range
      parameters:
        - in: header
          name: authorizationHeader
          description: The JWT as issued by the Datarock Platform UI, prepended with the Bearer identifier
          schema:
            $ref: '#/components/parameters/authorizationHeader'
          required: true
        - $ref: '#/components/parameters/projectUuid'
        - $ref: '#/components/parameters/productUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectProductEntitlementModification'
            example:
              type: SUB_SETUP
              amountInMetres: 30000
              notes: Subscription setup entitlement for Essentials plan
              effectiveDate: 2024-11-22
      responses:
        '201':
          description: Ledger entry created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The modification requested would result in an entitlement with a negative balance, or the entitlement is unlimited
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/ledgerEntries:
    get:
      tags:
        - Entitlements
      summary: List all ledger entries
      parameters:
        - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2LedgerEntriesExportObject'
              example:
                entries:
                  - id: 1
                    type: SUB_SETUP
                    amountInMetres: 30000
                    notes: Subscription setup entitlement for Essentials plan
                    referenceId: PLT-3293
                    referenceSystem: JIRA
                    createdBy: user@email.com
                    createdAt: 2024-11-22T00:00:00Z
                    projectProductEntitlementId: 1
                  - id: 2
                    type: TOP_UP
                    amountInMetres: 10001
                    notes: Top-up entitlement for Essentials plan
                    referenceId: PLT-3294
                    referenceSystem: JIRA
                    createdBy: user@email.com
                    createdAt: 2024-12-25T00:00:00Z
                    projectProductEntitlementId: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/subscriptionProductEntitlements:
    get:
      tags:
        - Entitlements
      summary: List all subscription product entitlements
      parameters:
        - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2SubscriptionProductEntitlementsExportObject'
              example:
                subscriptionProductEntitlements:
                  - id: '123e4567-e89b-12d3-a456-426614174000'
                    subscriptionId: '456e4567-e89b-12d3-a456-426614174000'
                    productId: '789e4567-e89b-12d3-a456-426614174000'
                    isUnlimited: false
                  - id: '123e4567-e89b-12d3-a456-426614174001'
                    subscriptionId: '456e4567-e89b-12d3-a456-426614174001'
                    productId: '789e4567-e89b-12d3-a456-426614174001'
                    isUnlimited: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v2/subscriptionLedgerEntries:
    get:
      tags:
        - Entitlements
      summary: List all subscription ledger entries
      parameters:
        - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2SubscriptionLedgerEntriesExportObject'
              example:
                subscriptionLedgerEntries:
                  - id: '1'
                    type: 'SUB_SETUP'
                    amountInMetres: 30000
                    notes: 'Subscription setup entitlement'
                    referenceId: 'PLT-3293'
                    referenceSystem: 'JIRA'
                    subscriptionProductEntitlementId: '123e4567-e89b-12d3-a456-426614174000'
                    createdBy: 'admin@datarock.com.au'
                  - id: '2'
                    type: 'TOP_UP'
                    amountInMetres: 10000
                    notes: 'Top-up entitlement'
                    referenceId: 'PLT-3294'
                    referenceSystem: 'JIRA'
