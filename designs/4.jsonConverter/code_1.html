<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>JSON/YAML Formatter &amp; Converter</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#25d1f4",
                        "background-light": "#f5f8f8",
                        "background-dark": "#101f22",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "mono": ["JetBrains Mono", "monospace"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .code-editor-shadow {
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<header class="h-16 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-6 flex items-center justify-between sticky top-0 z-50">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center text-white">
<span class="material-symbols-outlined text-2xl">code_blocks</span>
</div>
<div>
<h1 class="font-bold text-lg leading-none">DevFlow</h1>
<p class="text-xs text-slate-500 dark:text-slate-400">Formatter &amp; Converter</p>
</div>
</div>
<div class="flex items-center gap-6">
<nav class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-600 dark:text-slate-300">
<a class="hover:text-primary transition-colors" href="#">History</a>
<a class="hover:text-primary transition-colors" href="#">Documentation</a>
<a class="hover:text-primary transition-colors" href="#">Settings</a>
</nav>
<div class="h-6 w-[1px] bg-slate-200 dark:bg-slate-800 hidden md:block"></div>
<div class="flex items-center gap-2">
<button class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg text-slate-500 transition-colors">
<span class="material-symbols-outlined">dark_mode</span>
</button>
<button class="bg-primary text-slate-900 px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 hover:opacity-90 transition-opacity">
<span class="material-symbols-outlined text-sm">delete</span>
                    Clear All
                </button>
</div>
</div>
</header>
<main class="flex-1 flex overflow-hidden">
<!-- Sidebar Actions -->
<aside class="w-72 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-6 flex flex-col gap-8">
<div>
<h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4">Core Actions</h3>
<div class="flex flex-col gap-2">
<button class="flex items-center gap-3 w-full px-4 py-3 bg-primary/10 text-primary rounded-xl font-semibold text-sm hover:bg-primary/20 transition-colors group">
<span class="material-symbols-outlined group-hover:rotate-12 transition-transform">magic_button</span>
                        Beautify Code
                    </button>
<button class="flex items-center gap-3 w-full px-4 py-3 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl font-medium text-sm transition-colors">
<span class="material-symbols-outlined">compress</span>
                        Minify Output
                    </button>
</div>
</div>
<div>
<h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4">Conversion</h3>
<div class="flex flex-col gap-2">
<button class="flex items-center justify-between w-full px-4 py-3 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl font-medium text-sm transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined">swap_horiz</span>
                            To YAML
                        </div>
<kbd class="text-[10px] bg-slate-100 dark:bg-slate-700 px-1.5 py-0.5 rounded border border-slate-200 dark:border-slate-600 text-slate-400">Ctrl+Y</kbd>
</button>
<button class="flex items-center justify-between w-full px-4 py-3 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl font-medium text-sm transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined">data_object</span>
                            To JSON
                        </div>
<kbd class="text-[10px] bg-slate-100 dark:bg-slate-700 px-1.5 py-0.5 rounded border border-slate-200 dark:border-slate-600 text-slate-400">Ctrl+J</kbd>
</button>
</div>
</div>
<div class="mt-auto">
<h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4">Export</h3>
<div class="flex flex-col gap-2">
<button class="flex items-center gap-3 w-full px-4 py-3 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl font-medium text-sm transition-colors">
<span class="material-symbols-outlined">content_copy</span>
                        Copy Result
                    </button>
<button class="flex items-center gap-3 w-full px-4 py-3 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl font-medium text-sm transition-colors">
<span class="material-symbols-outlined">download</span>
                        Download File
                    </button>
</div>
</div>
</aside>
<!-- Editor Area -->
<section class="flex-1 bg-background-light dark:bg-background-dark p-8 flex flex-col gap-6">
<!-- Tabs -->
<div class="flex items-center justify-between">
<div class="flex p-1 bg-slate-200/50 dark:bg-slate-800/50 rounded-xl w-fit">
<button class="px-6 py-2 rounded-lg text-sm font-semibold bg-white dark:bg-slate-700 shadow-sm text-slate-900 dark:text-white transition-all">
                        Input
                    </button>
<button class="px-6 py-2 rounded-lg text-sm font-semibold text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-all">
                        Formatted Result
                    </button>
</div>
<div class="flex items-center gap-4">
<div class="flex items-center gap-2 px-3 py-1.5 bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400 rounded-full text-xs font-bold border border-green-200 dark:border-green-800/50">
<span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
                        Valid JSON
                    </div>
</div>
</div>
<!-- Editor Wrapper -->
<div class="flex-1 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 code-editor-shadow overflow-hidden flex flex-col relative">
<!-- Editor Gutter & Content -->
<div class="flex-1 flex overflow-auto">
<!-- Line Numbers -->
<div class="w-12 bg-slate-50 dark:bg-slate-900/50 border-r border-slate-100 dark:border-slate-800 flex flex-col items-center py-4 font-mono text-xs text-slate-300 dark:text-slate-600 select-none">
<span>1</span>
<span>2</span>
<span>3</span>
<span>4</span>
<span>5</span>
<span>6</span>
<span>7</span>
<span>8</span>
<span>9</span>
<span>10</span>
<span>11</span>
<span>12</span>
<span>13</span>
<span>14</span>
</div>
<!-- Actual Editor Area -->
<div class="flex-1 relative">
<textarea class="w-full h-full p-4 font-mono text-sm bg-transparent border-none focus:ring-0 resize-none text-slate-700 dark:text-slate-300 placeholder:text-slate-300" placeholder='{ "paste": "your code here" }'>{
  "project": "DevFlow Utility",
  "version": "2.1.0",
  "features": [
    "JSON Formatting",
    "YAML Conversion",
    "Minification",
    "Syntax Highlighting"
  ],
  "active": true,
  "config": {
    "tabSize": 2,
    "theme": "light-plus"
  }
}</textarea>
</div>
</div>
<!-- Editor Toolbar -->
<div class="h-10 border-t border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/50 px-4 flex items-center justify-between">
<div class="flex items-center gap-4 text-[11px] font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">
<span>JSON</span>
<span>UTF-8</span>
<span>LF</span>
</div>
<div class="flex items-center gap-4 text-[11px] font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">
<span>Chars: 248</span>
<span>Lines: 14</span>
</div>
</div>
<!-- Floating Convert Button -->
<button class="absolute bottom-16 right-8 bg-primary text-slate-900 h-14 pl-5 pr-6 rounded-full font-bold flex items-center gap-3 shadow-lg hover:scale-105 active:scale-95 transition-all">
<span class="material-symbols-outlined">sync</span>
                    Convert Now
                </button>
</div>
</section>
</main>
<!-- Success Toast (Hidden) -->
<div class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-full flex items-center gap-3 shadow-2xl invisible opacity-0 translate-y-4">
<span class="material-symbols-outlined text-green-400">check_circle</span>
<span class="text-sm font-medium">Successfully copied to clipboard</span>
</div>
</body></html>
